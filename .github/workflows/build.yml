name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn từ Github
        uses: actions/checkout@v4

      - name: Thiết lập Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho file Gradlew
        run: chmod +x gradlew

      - name: Dọn dẹp và Build APK (Ghi log chi tiết)
        run: ./gradlew clean assembleDebug --stacktrace --info

      - name: Xuất file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
